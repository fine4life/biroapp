apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: biroapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fine4life/biroapp.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: biroapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
